openapi: 3.0.3
info:
  title: 迈谱 Maple API
  version: production
  description: 同源会话接口；教师与学生权限由 HttpOnly 会话 Cookie 控制。
servers:
  - url: /
paths:
  /api/health:
    get:
      summary: 服务健康状态
      responses:
        '200': {description: 正常}
  /api/session:
    get:
      summary: 当前会话
      responses:
        '200': {description: 会话状态}
  /api/setup:
    post:
      summary: 首次运行时注册首位教师并初始化班级访问规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupToken, username, password, recoveryCode, classCode, groupCodePrefix, groupCount]
              properties:
                setupToken: {type: string, minLength: 12}
                username: {type: string, minLength: 3, maxLength: 40}
                password: {type: string, minLength: 12}
                recoveryCode: {type: string, minLength: 16}
                classCode: {type: string, minLength: 6, description: 可包含“七年级/八年级/九年级”等年级标识；服务端仅持久化其哈希及识别出的年级}
                groupCodePrefix: {type: string, minLength: 4}
                groupCount: {type: integer, minimum: 1, maximum: 20}
      responses:
        '201': {description: 初始化完成，教师注册码随即失效}
        '403': {description: 教师注册码无效}
        '409': {description: 平台已经初始化}
  /api/login:
    post:
      summary: 教师或学生小组登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': {description: 登录成功}
        '401': {description: 登录信息错误}
  /api/teacher/register:
    post:
      summary: 使用管理员生成的一次性注册码注册教师账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode, username, password]
              properties:
                inviteCode: {type: string}
                username: {type: string, minLength: 3, maxLength: 40}
                password: {type: string, minLength: 12}
      responses:
        '201': {description: 教师账号已创建，注册码随即失效}
        '403': {description: 注册码无效或已使用}
  /api/logout:
    post:
      summary: 退出登录
      responses:
        '200': {description: 已退出}
  /api/admin/recover:
    post:
      summary: 使用管理员恢复码重置教师密码并注销全部会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, recoveryCode, newPassword]
              properties:
                username: {type: string}
                recoveryCode: {type: string, minLength: 16}
                newPassword: {type: string, minLength: 12}
      responses:
        '200': {description: 密码已重置}
        '401': {description: 管理员账号或恢复码错误}
  /api/admin/factory-reset:
    post:
      summary: 使用管理员恢复码清空课堂数据并保留管理员身份
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryCode, confirmation]
              properties:
                recoveryCode: {type: string, minLength: 16}
                confirmation: {type: string, enum: [RESET]}
      responses:
        '200': {description: 课堂数据已清空，管理员账号、恢复码和访问规则保留}
        '401': {description: 管理员恢复码错误}
        '403': {description: 仅管理员教师可执行}
  /api/admin/access:
    get:
      summary: 获取管理员账号与访问配置状态
      responses:
        '200': {description: 不含任何明文凭据的配置状态}
        '403': {description: 仅教师管理员可访问}
    post:
      summary: 重置管理员账号、访问码、恢复码或生成教师注册码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, currentPassword]
              properties:
                action: {type: string, enum: [teacher, class_code, group_code, all_group_codes, recovery_code, teacher_invite]}
                currentPassword: {type: string}
      responses:
        '200': {description: 已更新并注销相关会话}
        '401': {description: 当前教师密码错误}
  /api/state:
    get:
      summary: 获取当前班级配置与本组状态
      parameters:
        - in: query
          name: group
          schema: {type: integer, minimum: 1, maximum: 20}
          description: 仅教师可选择查看的小组
      responses:
        '200': {description: 状态对象，包含五阶段四项任务的布尔矩阵 stageTaskStatus 与已验证的 stageSubmitted}
        '401': {description: 未登录}
    put:
      summary: 保存状态；学生只能写入本组字段，服务器按实际模型变化维护版本快照
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: object
                  required: [_revision]
                  properties:
                    _revision: {type: integer, minimum: 0, description: 当前小组服务端版本}
                    _classRevision: {type: integer, minimum: 0, description: 教师保存时必填的班级服务端版本}
      responses:
        '200': {description: 已保存，返回 ok、updatedAt 和包含实际版本及任务状态的 state}
        '403': {description: 权限不足}
        '409': {description: 版本冲突返回 code=revision_conflict 和当前 state，或阶段与成员状态不允许提交}
  /api/broadcast:
    get:
      summary: 获取当前广播及本组查看状态或全班查看进度
      responses:
        '200': {description: 当前广播、广播标识及查看小组列表}
        '401': {description: 未登录}
    post:
      summary: 教师发布或撤下平台广播
      responses:
        '200': {description: 广播已保存并重置查看状态}
        '403': {description: 仅教师可发布}
  /api/broadcast/ack:
    post:
      summary: 学生小组确认已查看当前广播
      responses:
        '200': {description: 已记录本组查看状态}
        '400': {description: 广播已更新、撤下或标识无效}
        '403': {description: 仅学生小组可确认}
  /api/hints:
    post:
      summary: 在当前求助主题内处理初中数学问题、主动升级、结束主题或请求教师
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [ask, advance, resolve, teacher]
                  default: ask
                done: {type: string, maxLength: 1600}
                issue: {type: string, maxLength: 1200}
                type: {type: string, maxLength: 80}
                attempt: {type: string, maxLength: 1600}
                checkedWork: {type: boolean}
      responses:
        '200': {description: 当前层 DeepSeek 支架、无扣额静态支架、层级转换或教师升级结果}
        '422': {description: 非初中数学问题；不会调用模型或消耗提示额度}
        '409': {description: 当前层额度已用完、AI暂停或主题状态不允许该操作}
        '403': {description: 仅学生小组可调用}
  /api/ai/chat:
    post:
      summary: 学生自由AI工作区的初中数学多轮对话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: {type: string, maxLength: 2400}
                conversationId: {type: string, description: 要继续的自由AI对话ID}
                newConversation: {type: boolean, default: false}
      responses:
        '200': {description: 豆包文本回答或Seedream图片结果；未配置文本模型时返回平台降级引导}
        '429': {description: 方舟账户或模型达到推理限额}
        '503': {description: 生图请求缺少ARK_API_KEY}
        '409': {description: AI暂停或自由工作区额度已用完}
        '422': {description: 非初中数学问题；不会调用模型、写入对话或消耗额度}
        '403': {description: 仅学生小组可调用}
  /api/ai/files/{fileId}:
    get:
      summary: 下载本平台生成的文件
      parameters:
        - in: path
          name: fileId
          required: true
          schema: {type: string}
      responses:
        '200': {description: 文件内容}
        '404': {description: 文件不存在}
  /api/escalations:
    post:
      summary: 学生主动转教师处理
      responses:
        '200': {description: 已进入教师队列}
  /api/files:
    get:
      summary: 项目材料列表
      responses:
        '200': {description: 文件元数据}
    post:
      summary: 教师上传审核材料
      responses:
        '200': {description: 上传成功}
        '403': {description: 仅教师可上传}
  /api/lesson-plan:
    get:
      summary: 教师读取12项字段定义、已发布配置及本人最新解析任务
      responses:
        '200': {description: fields、published、job；不包含原文件字节}
        '403': {description: 仅教师可访问}
  /api/lesson-plan/analyze:
    post:
      summary: 教师上传PDF或DOCX并按指定总课时数解析，或以retryId重试
      responses:
        '202': {description: 任务已创建，返回id}
        '400': {description: 文件、课时数或模型配置无效}
  /api/lesson-plan/source:
    get:
      summary: 上传教师预览或下载私有原文件（id；preview=1正文预览；download=1下载）
      responses:
        '200': {description: PDF原格式或DOCX安全正文预览、原文件下载}
        '404': {description: 文件不存在或不属于当前教师}
  /api/lesson-plan/publish:
    post:
      summary: 教师审核保存课时项目信息及课程支持材料
      description: plan含lessons[].projectInfo的12项字段；selectedLesson选择课时；revision用于乐观锁；reviewed为true；sourceJobId只能引用本人上传；shareSource为false时撤回材料，true时发布材料。
      responses:
        '200': {description: 发布后的配置、revision及supportMaterial}
        '400': {description: 配置或版本无效，事务不保存}
  /api/lesson-plan/current:
    get:
      summary: 已登录师生读取当前课时项目信息和已发布材料元数据
      responses:
        '200': {description: currentLesson包含projectInfo、supportMaterial和revision，无私有解析记录}
        '401': {description: 未登录}
  /api/lesson-plan/material:
    get:
      summary: 已登录师生预览或下载已发布课程材料（id、preview或download参数）
      responses:
        '200': {description: 文件或安全预览，仅允许同站嵌入}
        '401': {description: 未登录}
        '404': {description: 已撤回或不存在}
  /api/export:
    get:
      summary: 教师导出去标识化课堂事件
      parameters:
        - in: query
          name: format
          schema: {type: string, enum: [csv, json]}
      responses:
        '200': {description: 下载文件}
        '403': {description: 仅教师可导出}
  /api/classroom/config:
    post:
      summary: 教师保存简明任务、已学知识与阶段提示配置
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/control:
    post:
      summary: 教师按组暂缓、放行、回退或恢复跟随全班
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/advance:
    post:
      summary: 教师推进可推进小组并保留暂缓组
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/ai-access:
    post:
      summary: 教师按组开放或暂停自由AI
      responses:
        '200': {description: 操作完成}
        '403': {description: 权限不足}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/thought:
    post:
      summary: 学生保存一位成员的文本或照片想法并追加修订历史
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/roles:
    post:
      summary: 确认本轮职责及不轮换原因
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/evaluation:
    post:
      summary: 教师保存、发布或撤回评价
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/queue:
    post:
      summary: 教师标记求助状态及优先级
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/help-feedback:
    post:
      summary: 学生记录后续尝试并确认是否解决
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/copy:
    post:
      summary: 教师复制自有项目为独立草稿
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/review:
    post:
      summary: 教师保存课后复盘
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/join-token:
    post:
      summary: 教师生成短期一次性小组入口
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/join-revoke:
    post:
      summary: 教师撤销小组入口
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/join-info:
    post:
      summary: 读取一次性入口的小组信息
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
  /api/classroom/join:
    post:
      summary: 验证一次性令牌并建立小组会话
      responses:
        '200': {description: 操作完成}
        '400': {description: 输入需要补充或修正}
        '403': {description: 权限不足或入口已失效}
        '409': {description: 记录已有更新，需比较版本}
